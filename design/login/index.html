<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aaru · Sign in</title>
<link rel="icon" href="../design-system/assets/aaru-favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#030507}
a{color:#c9d3e2}a:hover{color:#ffffff}
.aaru-card{animation:aaruIn 1.6s cubic-bezier(.2,.7,.2,1) 2.2s both}
@keyframes aaruIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.aaru-card{animation:none}}
.aaru-input::placeholder{color:rgba(225,231,240,0.5)}
.aaru-input:focus{outline:2px solid #c9d3e2;outline-offset:1px;border-color:transparent}
.aaru-btn:hover{background:#e8edf4}
.aaru-btn:focus-visible,.aaru-ghost:focus-visible{outline:2px solid #c9d3e2;outline-offset:2px}
.aaru-ghost:hover{background:rgba(255,255,255,0.08)}
</style>
</head>
<body>
<div style="position: relative; width: 100%; min-height: 100vh; overflow: hidden; background: #030507; color: #e7ebf1; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column">
<canvas id="reeds" data-aaru-reeds="1" aria-hidden="true" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block"></canvas>

<header style="position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 20px 28px">
<div style="font-family: 'Cinzel', serif; font-weight: 600; font-size: 15px; letter-spacing: 0.32em; color: #e7ebf1">AARU</div>
<nav style="display: flex; align-items: center; gap: 8px">
<button type="button" class="aaru-ghost" id="replay" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.16); background: rgba(6,9,13,0.4); color: #e7ebf1; font: 500 14px 'Inter', system-ui, sans-serif; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
Replay
</button>
<a href="#" style="display: inline-flex; align-items: center; height: 44px; padding: 0 12px; font-size: 14px; text-decoration: none">Help</a>
</nav>
</header>

<div style="position: relative; height: 50vh; min-height: 300px; flex-shrink: 0"></div>

<main style="position: relative; z-index: 1; display: flex; justify-content: center; padding: 0 20px 32px">
<form class="aaru-card" id="login-form" style="width: 100%; max-width: 380px; box-sizing: border-box; padding: 28px; border-radius: 14px; background: rgba(5,8,12,0.66); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Cinzel', serif; font-weight: 500; font-size: 24px; letter-spacing: 0.04em; color: #f2f5f9">Welcome back</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: rgba(231,235,241,0.76)">Sign in to return to the Field of Reeds.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="aaru-email" style="font-size: 13px; font-weight: 500; color: #dfe5ee">Email</label>
<input id="aaru-email" class="aaru-input" type="email" name="email" autocomplete="email" placeholder="you@example.com" style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); color: #f2f5f9; font: 400 15px 'Inter', system-ui, sans-serif">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<label for="aaru-pass" style="font-size: 13px; font-weight: 500; color: #dfe5ee">Password</label>
<a href="#" style="font-size: 13px">Forgot password?</a>
</div>
<input id="aaru-pass" class="aaru-input" type="password" name="password" autocomplete="current-password" placeholder="••••••••" style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); color: #f2f5f9; font: 400 15px 'Inter', system-ui, sans-serif">
</div>
<label for="aaru-keep" style="display: flex; align-items: center; gap: 10px; min-height: 28px; font-size: 14px; color: rgba(231,235,241,0.82); cursor: pointer">
<input id="aaru-keep" type="checkbox" name="keep" style="width: 18px; height: 18px; margin: 0; accent-color: #c9d3e2">
Keep me signed in
</label>
<button type="submit" class="aaru-btn" style="height: 46px; border: none; border-radius: 8px; background: #d6dde8; color: #0b1017; font: 600 15px 'Inter', system-ui, sans-serif; letter-spacing: 0.02em; cursor: pointer">Enter Aaru</button>
<p role="status" id="sent" hidden style="margin: 0; font-size: 13px; line-height: 1.5; color: #c9d3e2">Example screen only — nothing was sent.</p>
<p style="margin: 0; padding-top: 4px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 14px; color: rgba(231,235,241,0.76)">New here? <a href="#">Create an account</a></p>
</form>
</main>

<footer style="position: relative; z-index: 1; margin-top: auto; display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; padding: 0 20px 20px; font-size: 12px; color: rgba(231,235,241,0.7)">
<span>© 2026 Aaru</span>
<a href="#">Privacy</a>
<a href="#">Terms</a>
</footer>
</div>
<script>
class ReedsScene {
  componentWillUnmount() {
    this._alive = false;
    this.stopGL();
  }
  _attach(el) {
    if (el && el !== this._canvas) {
      this.stopGL();
      this._canvas = el;
      this.startGL(el);
    }
  }
  stopGL() {
    if (this._raf) cancelAnimationFrame(this._raf);
    this._raf = 0;
    if (this._ro) { this._ro.disconnect(); this._ro = null; }
  }
  buildReeds() {
    var seed = 20261108;
    var rnd = function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    var A = [[-0.36, 0.0, -0.05, 1.0], [0.36, 0.0, 0.05, 1.0], [-0.27, 0.36, 0.27, 0.36]];
    var R = [[-0.28, 0.0, -0.28, 1.0], [-0.40, 0.93, 0.24, 0.93], [0.29, 0.95, 0.29, 0.48], [-0.40, 0.52, 0.30, 0.52], [-0.02, 0.50, 0.38, 0.0]];
    var U = [[-0.29, 0.10, -0.29, 1.0], [0.29, 0.10, 0.29, 1.0], [-0.40, 0.07, 0.40, 0.07]];
    var glyphs = [A, A, R, U];
    var reeds = [];
    var startPos = function (stray) {
      for (var k = 0; k < 40; k++) {
        var x = -2.5 + rnd() * 5.0, z = -1.0 + rnd() * 2.7;
        var inside = Math.abs(x) < 2.0 && z > -0.65 && z < 0.75;
        if (!stray || !inside) return [x, z];
      }
      return [2.3, 1.2];
    };
    for (var li = 0; li < 4; li++) {
      var cx = -1.47 + 0.98 * li;
      glyphs[li].forEach(function (s) {
        var x0 = cx + s[0], z0 = 0.5 - s[1], x1 = cx + s[2], z1 = 0.5 - s[3];
        var dx = x1 - x0, dz = z1 - z0, len = Math.sqrt(dx * dx + dz * dz);
        var ux = dx / len, uz = dz / len, px = -uz, pz = ux;
        for (var k = 0; k < 4; k++) {
          var o = (k - 1.5) * 0.042 + (rnd() - 0.5) * 0.008;
          var al = (rnd() - 0.5) * 0.06;
          var sp = startPos(false);
          reeds.push({
            tx: (x0 + x1) / 2 + px * o + ux * al, tz: (z0 + z1) / 2 + pz * o + uz * al,
            ta: Math.atan2(uz, ux), hl: len / 2 + 0.05 + (rnd() - 0.5) * 0.06,
            sx: sp[0], sz: sp[1], sa: rnd() * Math.PI, letter: li, stray: false,
            r1: rnd(), r2: rnd(), r3: rnd(), vx: (rnd() - 0.5) * 0.06, vz: (rnd() - 0.5) * 0.06, w: (rnd() - 0.5) * 0.16, seed: rnd()
          });
        }
      });
    }
    for (var j = 0; j < 14; j++) {
      var sp2 = startPos(true);
      var ang = Math.atan2(sp2[1] - 0.2, sp2[0]);
      reeds.push({
        tx: 0, tz: 0, ta: 0, hl: 0.16 + rnd() * 0.22, sx: sp2[0], sz: sp2[1], sa: rnd() * Math.PI, letter: 0, stray: true,
        r1: rnd(), r2: rnd(), r3: rnd(), vx: Math.cos(ang) * 0.015, vz: Math.sin(ang) * 0.015, w: (rnd() - 0.5) * 0.1, seed: rnd()
      });
    }
    return reeds;
  }
  fragSrc() {
    return `#version 300 es
precision highp float;
precision highp sampler2D;
uniform vec2 uRes;
uniform float uTime;
uniform float uCam;
uniform int uN;
uniform sampler2D uData;
out vec4 fragColor;

const vec3 L = vec3(-0.500, 0.740, -0.450);
const vec3 MOON = vec3(0.70, 0.79, 1.00);

float hash(vec3 p){ p = fract(p*0.3183099 + 0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float noise(vec3 x){
  vec3 i = floor(x); vec3 f = fract(x); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(hash(i), hash(i+vec3(1.,0.,0.)), f.x),
                 mix(hash(i+vec3(0.,1.,0.)), hash(i+vec3(1.,1.,0.)), f.x), f.y),
             mix(mix(hash(i+vec3(0.,0.,1.)), hash(i+vec3(1.,0.,1.)), f.x),
                 mix(hash(i+vec3(0.,1.,1.)), hash(i+vec3(1.,1.,1.)), f.x), f.y), f.z);
}

float baseWaves(vec2 p, float t){
  float h = 0.010*sin(dot(p, vec2(0.8,0.6))*2.1 + t*0.9)
          + 0.007*sin(dot(p, vec2(-0.6,0.8))*3.3 + t*1.3)
          + 0.004*sin(dot(p, vec2(0.3,-0.95))*5.7 + t*1.9);
  h += (noise(vec3(p*3.0 + vec2(t*0.05, t*0.03), t*0.25)) - 0.5)*0.030;
  h += (noise(vec3(p*7.0 + vec2(5.0 - t*0.08, t*0.06), t*0.45)) - 0.5)*0.014;
  h += (noise(vec3(p*16.0 + vec2(t*0.12, 9.0 - t*0.1), t*0.8)) - 0.5)*0.0075;
  h += (noise(vec3(p*36.0 + vec2(2.0 - t*0.2, t*0.15), t*1.4)) - 0.5)*0.0036;
  return h;
}

float segDist(vec2 q, vec2 dir, float hl){
  float al = dot(q, dir);
  float ac = dot(q, vec2(-dir.y, dir.x));
  float da = max(abs(al) - hl, 0.0);
  return sqrt(da*da + ac*ac);
}

vec2 bubblePos(vec2 dir, float hl, float seed, float fk){
  float hb1 = fract(seed*91.7 + fk*0.37), hb2 = fract(seed*53.3 + fk*0.71);
  return dir*(hl - hb2*hl*1.4) + vec2(-dir.y, dir.x)*(hb1 - 0.5)*0.03;
}
float bubbleAge(float age, float seed, float fk){
  return age + 0.9 - fk*0.35 - fract(seed*91.7 + fk*0.37)*0.2;
}

// A: centre.xz, angle, projected half-length   B: tip depth (neg = above), age since tip broke surface, glide speed, seed
// C: tan(pitch), age since it fell flat (-1 = not yet), true half-length
float reedRip(vec2 q, vec2 dir, vec4 A, vec4 B, vec4 C, float rad){
  float h = 0.0;
  float d = segDist(q, dir, A.w);
  float dt = length(q - dir*A.w);
  float age = B.y, la = C.y;
  bool isFlat = la >= 0.0;
  if (age < 0.0 && B.x < 0.08) h += 0.010*(1.0 - max(B.x, 0.0)/0.08)*exp(-dt*30.0);
  if (isFlat) h += 0.0025*exp(-max(d - rad, 0.0)/0.007);
  else if (age >= 0.0) h += 0.0035*exp(-max(dt - rad, 0.0)/0.008);
  if (age >= 0.0 && age < 4.0){
    float x = dt - age*0.25;
    h += 0.005*sin(x*75.0)*exp(-x*x*450.0)*exp(-age*0.9);
  }
  if (isFlat && la < 4.0){
    float x = d - la*0.3;
    h += 0.008*sin(x*65.0)*exp(-x*x*350.0)*exp(-la*0.9);
    h -= 0.006*exp(-la*6.0)*exp(-d*30.0);
  }
  if (B.z > 0.001) h += min(B.z, 0.3)*0.03*sin(d*55.0 - uTime*9.0)*exp(-d*9.0);
  for (int k = 0; k < 3; k++){
    float fk = float(k);
    float ba = bubbleAge(age, B.w, fk);
    if (ba > 0.7 && ba < 2.2){
      float x = length(q - bubblePos(dir, A.w, B.w, fk)) - (ba - 0.7)*0.15;
      h += 0.0015*sin(x*120.0)*exp(-x*x*3000.0)*exp(-(ba - 0.7)*2.0);
    }
  }
  return h;
}

vec3 moonRad(vec3 r){
  float d = max(dot(r, L), 0.0);
  return MOON*(pow(d, 3000.0)*140.0 + pow(d, 400.0)*8.0 + pow(d, 60.0)*0.5);
}

void main(){
  vec2 uv0 = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;
  vec2 uv = uv0; uv.y -= 0.2;
  float H = uCam;
  vec3 ro = vec3(sin(uTime*0.04)*0.03, H, cos(uTime*0.05)*0.03);
  vec3 rd = normalize(vec3(uv.x, -1.6, -uv.y));
  float tW = ro.y/(-rd.y);
  vec2 p = (ro + rd*tW).xz;
  float px = tW/(1.6*uRes.y);
  float e = 0.0022 + 0.0003*tW;
  float t = uTime;
  float h0 = baseWaves(p, t);
  float hx = baseWaves(p + vec2(e, 0.0), t);
  float hz = baseWaves(p + vec2(0.0, e), t);
  vec3 nb = normalize(vec3(h0 - hx, e, h0 - hz));

  float bestTop = -1e3; float bCov = 0.0;
  float bAlong = 0.0, bS = 0.0, bHl = 1.0, bAng = 0.0, bY = 0.0, bSeed = 0.0, bTan = 0.0, bAge = 0.0;
  vec3 bub = vec3(0.0); float bubCov = 0.0;
  for (int i = 0; i < 128; i++){
    if (i >= uN) break;
    vec4 A = texelFetch(uData, ivec2(i, 0), 0);
    vec4 B = texelFetch(uData, ivec2(i, 1), 0);
    vec4 C = texelFetch(uData, ivec2(i, 2), 0);
    vec2 dc = p - A.xy;
    float r1 = (B.y > -1.0 && B.y < 4.0) ? max(B.y, 0.0)*0.25 + 0.1 : 0.0;
    float r2 = (C.y >= 0.0 && C.y < 4.0) ? C.y*0.3 + 0.1 : 0.0;
    float cullR = A.w + 0.14 + max(r1, r2) + B.z*2.0;
    if (dot(dc, dc) > cullR*cullR) continue;
    vec2 dir = vec2(cos(A.z), sin(A.z));
    vec2 perp = vec2(-dir.y, dir.x);
    float R = 0.02*(0.85 + 0.3*fract(B.w*13.7));
    h0 += reedRip(dc, dir, A, B, C, R);
    hx += reedRip(dc + vec2(e, 0.0), dir, A, B, C, R);
    hz += reedRip(dc + vec2(0.0, e), dir, A, B, C, R);

    // air escaping the hollow stem just before it surfaces
    for (int k = 0; k < 3; k++){
      float fk = float(k);
      float ba = bubbleAge(B.y, B.w, fk);
      if (ba > 0.0 && ba < 0.7){
        float br = 0.0058*(0.6 + 0.4*fract(B.w*53.3 + fk*0.71))*min(ba*8.0, 1.0);
        vec2 dv = (dc - bubblePos(dir, A.w, B.w, fk))/br;
        float s2 = length(dv);
        if (s2 < 1.0 + px/br){
          float cv = smoothstep(1.0 + px/br, 1.0 - px/br, s2);
          vec3 bn = normalize(vec3(dv.x, sqrt(max(1.0 - s2*s2, 0.0)), dv.y));
          bub += (moonRad(reflect(rd, bn))*0.25 + MOON*pow(min(s2, 1.0), 8.0)*0.05)*cv;
          bubCov = max(bubCov, cv);
        }
      }
    }

    float al = dot(dc, dir);
    if (abs(al) < A.w + 0.01){
      float y = -B.x - (A.w - al)*C.x;
      if (y > -0.12){
        float sub = max(-y, 0.0);
        vec2 dq = dc + nb.xz*sub*0.9;
        al = dot(dq, dir);
        float ac = dot(dq, perp);
        if (abs(al) < A.w){
          float tipT = smoothstep(A.w, A.w - 0.05, abs(al));
          float rad = R*(0.5 + 0.5*tipT);
          float cov = smoothstep(rad + px*0.5, rad - px*0.5, abs(ac))*smoothstep(A.w, A.w - px, abs(al));
          if (cov > 0.0){
            float top = y + B.w*0.004 + sqrt(max(rad*rad - ac*ac, 0.0));
            if (top > bestTop){
              bestTop = top; bCov = cov; bAlong = al; bS = clamp(ac/rad, -1.0, 1.0);
              bHl = A.w; bAng = A.z; bY = y; bSeed = B.w; bTan = C.x; bAge = B.y;
            }
          }
        }
      }
    }
  }

  // pure black water: only the moon, by reflection
  vec3 n = normalize(vec3(h0 - hx, e, h0 - hz));
  float fres = 0.02 + 0.98*pow(1.0 - max(dot(n, -rd), 0.0), 5.0);
  vec3 col = moonRad(reflect(rd, n))*fres;

  if (bCov > 0.0){
    vec2 dir = vec2(cos(bAng), sin(bAng));
    vec2 perp = vec2(-dir.y, dir.x);
    float s = bS;
    vec3 nr = normalize(vec3(perp.x*s, sqrt(max(1.0 - s*s, 0.0)), perp.y*s));
    nr = normalize(nr - vec3(dir.x, 0.0, dir.y)*bTan*nr.y);
    float u = bAlong;
    vec3 alb = mix(vec3(0.105, 0.09, 0.055), vec3(0.065, 0.075, 0.042), fract(bSeed*7.13));
    alb *= 0.75 + 0.45*noise(vec3(u*3.0, bSeed*50.0, 0.0));
    float fib = noise(vec3(u*6.0, s*16.0, bSeed*30.0));
    alb *= 0.82 + 0.25*fib;
    nr = normalize(nr + vec3(perp.x, 0.0, perp.y)*(fib - 0.5)*0.15);
    float fu = fract(u*4.2 + bSeed*3.0);
    float node = 1.0 - smoothstep(0.0, 0.035, min(fu, 1.0 - fu));
    alb *= 1.0 - 0.45*node;
    float endc = smoothstep(bHl - 0.012, bHl, abs(u));
    alb *= 1.0 - 0.5*endc;
    float wf = exp(-max(bAge, 0.0)/6.0);
    float dif = max(dot(nr, L), 0.0);
    vec3 rc = alb*(MOON*dif*1.15 + vec3(0.003, 0.004, 0.006));
    vec3 rr = reflect(rd, nr);
    float sd = max(dot(rr, L), 0.0);
    rc += MOON*(pow(sd, 90.0)*0.18 + pow(sd, 700.0)*1.6*(1.0 + wf))*(1.0 - 0.6*node);
    // beads of water on a freshly surfaced stem
    float bead = smoothstep(0.8, 0.9, noise(vec3(u*70.0, s*5.0, bSeed*40.0)))*wf;
    rc += MOON*bead*0.12*(0.3 + pow(sd, 20.0));
    float sub = max(-bY, 0.0);
    if (sub > 0.0) rc = rc*exp(-sub*40.0) + col;
    else rc = mix(rc, col, smoothstep(0.004, 0.0, bY)*0.5);
    col = mix(col, rc, bCov);
  }
  col = mix(col, bub, bubCov*0.85);

  col *= 1.25;
  col = (col*(2.51*col + 0.03))/(col*(2.43*col + 0.59) + 0.14);
  col = pow(clamp(col, 0.0, 1.0), vec3(0.4545));
  col *= 1.0 - 0.3*dot(uv0, uv0);
  col += (hash(vec3(gl_FragCoord.xy, fract(uTime)*91.0)) - 0.5)*0.006;
  fragColor = vec4(max(col, 0.0), 1.0);
}
`;
  }
  startGL(canvas) {
    var gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
    if (!gl) { console.warn('Aaru reeds: WebGL2 not available'); return; }
    var mk = function (type, src) {
      var s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.warn('Aaru reeds shader:', gl.getShaderInfoLog(s)); return null; }
      return s;
    };
    var vs = mk(gl.VERTEX_SHADER, '#version 300 es\nin vec2 aP; void main(){ gl_Position = vec4(aP, 0.0, 1.0); }');
    var fs = mk(gl.FRAGMENT_SHADER, this.fragSrc());
    if (!vs || !fs) return;
    var prog = gl.createProgram();
    gl.attachShader(prog, vs); gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.warn('Aaru reeds link:', gl.getProgramInfoLog(prog)); return; }
    gl.useProgram(prog);
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    var aP = gl.getAttribLocation(prog, 'aP');
    gl.enableVertexAttribArray(aP);
    gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
    var U = {};
    ['uRes', 'uTime', 'uCam', 'uN', 'uData'].forEach(function (n) { U[n] = gl.getUniformLocation(prog, n); });

    var reeds = this.buildReeds();
    var N = reeds.length;
    var data = new Float32Array(N * 3 * 4);
    var tex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, N, 3, 0, gl.RGBA, gl.FLOAT, data);
    gl.uniform1i(U.uData, 0);
    gl.uniform1i(U.uN, N);

    var reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var cw0 = Math.max(1, canvas.clientWidth * dpr), ch0 = Math.max(1, canvas.clientHeight * dpr);
    var scale = Math.max(0.5, Math.min(1, Math.sqrt(2400000 / (cw0 * ch0))));
    var resize = function () {
      var w = Math.max(1, Math.round(canvas.clientWidth * dpr * scale));
      var h = Math.max(1, Math.round(canvas.clientHeight * dpr * scale));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      gl.viewport(0, 0, w, h);
    };
    resize();
    if (window.ResizeObserver) { this._ro = new ResizeObserver(resize); this._ro.observe(canvas); }

    this._t0 = performance.now();
    var self = this, last = performance.now(), acc = 0, frames = 0, lastT = -1;
    var PI = Math.PI;
    var smooth = function (x) { x = Math.min(1, Math.max(0, x)); return x * x * x * (x * (x * 6 - 15) + 10); };
    var wrapPi = function (a) { a = (a + PI / 2) % PI; if (a < 0) a += PI; return a - PI / 2; };
    var loop = function (now) {
      if (!self._alive && self._alive !== undefined) return;
      self._raf = requestAnimationFrame(loop);
      var dt = now - last; last = now;
      if (dt < 100) { acc += dt; frames++; }
      if (frames >= 24) {
        var avg = acc / frames;
        if (avg > 22 && scale > 0.5) { scale = Math.max(0.5, scale * 0.9); resize(); }
        else if (avg < 13 && scale < 1) { scale = Math.min(1, scale * 1.05); resize(); }
        acc = 0; frames = 0;
      }
      var t = (now - self._t0) / 1000 + (reduce ? 120 : 0);
      var fs2 = Number(self.props && self.props.formSeconds);
      var D = Math.max(6, isFinite(fs2) && fs2 > 0 ? fs2 : 18);
      var stepDt = (lastT >= 0 && t > lastT && t - lastT < 0.2) ? t - lastT : 0;
      lastT = t;
      for (var i = 0; i < N; i++) {
        var r = reeds[i];
        var ts = 0.4 + r.r1 * 0.35 * D;
        var age = t - ts;
        var th0 = 0.45 + ((r.seed * 3.7) % 1) * 0.5;
        var Tf = 0.9 + ((r.seed * 5.3) % 1) * 0.5;
        var th, tipDepth, landAge = -1;
        if (age < 0) {
          // rising at a slant, buoyant end first
          th = th0; tipDepth = -age * 0.22;
        } else if (age < Tf) {
          // the end has broken the surface; the stem topples over like a falling pole
          var f = age / Tf;
          th = th0 * (1 - f * f);
          tipDepth = -0.012 * Math.sin(f * PI);
        } else {
          landAge = age - Tf;
          th = 0.035 * Math.exp(-landAge * 4) * Math.abs(Math.sin(landAge * 10));
          tipDepth = 0;
        }
        var td = Math.max(0, age - Tf);
        var ramp = Math.min(1, td / 3);
        var fx = r.sx + r.vx * td + Math.sin(t * 0.6 + r.seed * 20) * 0.03 * ramp;
        var fz = r.sz + r.vz * td + Math.cos(t * 0.5 + r.seed * 11) * 0.03 * ramp;
        var fa = r.sa + r.w * td;
        var x = fx, z = fz, a = fa;
        if (!r.stray) {
          var tA = Math.max(ts + Tf + 1.2, 0.3 * D + r.r2 * 0.4 * D + r.letter * 0.04 * D);
          var g = Math.max(2.5, 0.18 * D * (0.8 + 0.4 * r.r3));
          var s = smooth((t - tA) / g);
          if (s > 0) {
            x = fx + (r.tx - fx) * s;
            z = fz + (r.tz - fz) * s;
            a = fa + wrapPi(r.ta - fa) * s;
            if (s >= 1) {
              x = r.tx - Math.sin(r.ta) * 0.003 * Math.sin(t * 0.7 + r.seed * 10);
              z = r.tz + Math.cos(r.ta) * 0.003 * Math.sin(t * 0.7 + r.seed * 10);
              a = r.ta + 0.006 * Math.sin(t * 0.5 + r.seed * 7);
            }
          }
        }
        var spd = 0;
        if (stepDt > 0 && r.px !== undefined) {
          var mx = x - r.px, mz = z - r.pz;
          spd = Math.sqrt(mx * mx + mz * mz) / stepDt + Math.abs(wrapPi(a - r.pa)) * r.hl / stepDt;
          spd = Math.max(0, spd - 0.04);
        }
        if (stepDt === 0) spd = 0;
        r.spd = (r.spd || 0) * 0.85 + spd * 0.15;
        r.px = x; r.pz = z; r.pa = a;
        // projected shape of a tilted stem: the surfaced end stays put, the far end swings out as it falls
        var c = Math.cos(th), ca = Math.cos(a), sa = Math.sin(a);
        var cx = x + ca * r.hl * (1 - c), cz = z + sa * r.hl * (1 - c);
        var o = i * 4, o2 = (N + i) * 4, o3 = (2 * N + i) * 4;
        data[o] = cx; data[o + 1] = cz; data[o + 2] = a; data[o + 3] = r.hl * c;
        data[o2] = tipDepth; data[o2 + 1] = Math.max(age, -5); data[o2 + 2] = r.spd; data[o2 + 3] = r.seed;
        data[o3] = Math.tan(th); data[o3 + 1] = landAge; data[o3 + 2] = r.hl; data[o3 + 3] = 0;
      }
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, N, 3, gl.RGBA, gl.FLOAT, data);
      var aspect = canvas.width / Math.max(1, canvas.height);
      gl.uniform2f(U.uRes, canvas.width, canvas.height);
      gl.uniform1f(U.uTime, t);
      gl.uniform1f(U.uCam, Math.max(4.2, 6.5 / aspect));
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };
    this._raf = requestAnimationFrame(loop);
  }
}

(function () {
  var params = new URLSearchParams(location.search);
  var scene = new ReedsScene();
  // Seconds for the reeds to gather into the word, 8-40. Override with ?form=.
  scene.props = { formSeconds: Math.min(40, Math.max(8, Number(params.get('form')) || 18)) };
  scene._alive = true;
  scene._attach(document.getElementById('reeds'));

  document.getElementById('replay').addEventListener('click', function () {
    scene._t0 = performance.now();
  });
  // Example form: nothing is sent anywhere.
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('sent').hidden = false;
  });
  Array.prototype.forEach.call(document.querySelectorAll('a[href="#"]'), function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); });
  });
})();
</script>
