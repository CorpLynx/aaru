<!-- @dsCard group="Spacing" viewport="700x300" subtitle="8pt grid; 4px half-step for IDE and chips only" name="Spacing scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg-app);color:var(--text-primary);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}.m{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}.d{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body><div style="padding:16px 24px;display:flex;flex-direction:column;gap:8px"><div style="display:grid;grid-template-columns:100px 40px 1fr;align-items:center;gap:12px"><span class="m">--space-0-5</span><span class="d">4px</span><div style="height:8px;width:12px;background:var(--aaru-fg-3);border-radius:1px"></div></div><div style="display:grid;grid-template-columns:100px 40px 1fr;align-items:center;gap:12px"><span class="m">--space-1</span><span class="d">8px</span><div style="height:8px;width:24px;background:var(--aaru-fg-1);border-radius:1px"></div></div><div style="display:grid;grid-template-columns:100px 40px 1fr;align-items:center;gap:12px"><span class="m">--space-1-5</span><span class="d">12px</span><div style="height:8px;width:36px;background:var(--aaru-fg-3);border-radius:1px"></div></div><div style="display:grid;grid-template-columns:100px 40px 1fr;align-items:center;gap:12px"><span class="m">--space-2</span><span class="d">16px</span><div style="height:8px;width:48px;background:var(--aaru-fg-1);border-radius:1px"></div></div><div style="display:grid;grid-template-columns:100px 40px 1fr;align-items:center;gap:12px"><span class="m">--space-3</span><span class="d">24px</span><div style="height:8px;width:72px;background:var(--aaru-fg-1);border-radius:1px"></div></div><div style="display:grid;grid-template-columns:100px 40px 1fr;align-items:center;gap:12px"><span class="m">--space-4</span><span class="d">32px</span><div style="height:8px;width:96px;background:var(--aaru-fg-1);border-radius:1px"></div></div><div style="display:grid;grid-template-columns:100px 40px 1fr;align-items:center;gap:12px"><span class="m">--space-5</span><span class="d">40px</span><div style="height:8px;width:120px;background:var(--aaru-fg-1);border-radius:1px"></div></div><div style="display:grid;grid-template-columns:100px 40px 1fr;align-items:center;gap:12px"><span class="m">--space-6</span><span class="d">48px</span><div style="height:8px;width:144px;background:var(--aaru-fg-1);border-radius:1px"></div></div><div style="display:grid;grid-template-columns:100px 40px 1fr;align-items:center;gap:12px"><span class="m">--space-8</span><span class="d">64px</span><div style="height:8px;width:192px;background:var(--aaru-fg-1);border-radius:1px"></div></div><div style="display:grid;grid-template-columns:100px 40px 1fr;align-items:center;gap:12px"><span class="m">--space-10</span><span class="d">80px</span><div style="height:8px;width:240px;background:var(--aaru-fg-1);border-radius:1px"></div></div><div style="display:grid;grid-template-columns:100px 40px 1fr;align-items:center;gap:12px"><span class="m">--space-12</span><span class="d">96px</span><div style="height:8px;width:288px;background:var(--aaru-fg-1);border-radius:1px"></div></div></div></body></html>
