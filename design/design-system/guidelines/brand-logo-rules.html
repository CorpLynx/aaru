<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg-app);color:var(--text-primary);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}.d{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body>
<div style="padding:20px 24px;display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:16px;color:#EDEFF2">
  <div style="display:flex;flex-direction:column;gap:8px"><div style="height:110px;border-radius:8px;background:#000;display:flex;align-items:center;justify-content:center;position:relative"><div style="padding:24px;outline:1px dashed #3A414C"><svg width="48" height="48" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5"><rect x="47" y="10" width="13" height="46" rx="6.5"/><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(60 50 50)"/><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(120 50 50)"/><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(180 50 50)"/><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(240 50 50)"/><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(300 50 50)"/></svg></div></div><span class="d">CLEAR SPACE = ½ MARK</span></div>
  <div style="display:flex;flex-direction:column;gap:8px"><div style="height:110px;border-radius:8px;background:#000;display:flex;align-items:center;justify-content:center"><svg width="48" height="48" viewBox="0 0 100 100" fill="none" stroke="#3DDC97" stroke-width="5"><rect x="47" y="10" width="13" height="46" rx="6.5"/><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(60 50 50)"/><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(120 50 50)"/><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(180 50 50)"/><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(240 50 50)"/><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(300 50 50)"/></svg></div><span class="d" style="color:var(--aaru-fault)">✕ NO ACCENT COLORS</span></div>
  <div style="display:flex;flex-direction:column;gap:8px"><div style="height:110px;border-radius:8px;background:#000;display:flex;align-items:center;justify-content:center"><div style="transform:scaleX(1.4)"><svg width="48" height="48" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5"><rect x="47" y="10" width="13" height="46" rx="6.5"/><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(60 50 50)"/><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(120 50 50)"/><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(180 50 50)"/><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(240 50 50)"/><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(300 50 50)"/></svg></div></div><span class="d" style="color:var(--aaru-fault)">✕ NO STRETCHING</span></div>
  <div style="display:flex;flex-direction:column;gap:8px"><div style="height:110px;border-radius:8px;background:#000;display:flex;align-items:center;justify-content:center"><div style="filter:drop-shadow(0 0 8px #FF7A33)"><svg width="48" height="48" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5"><rect x="47" y="10" width="13" height="46" rx="6.5"/><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(60 50 50)"/><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(120 50 50)"/><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(180 50 50)"/><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(240 50 50)"/><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(300 50 50)"/></svg></div></div><span class="d" style="color:var(--aaru-fault)">✕ NO GLOWS / EFFECTS</span></div>
</div></body></html>
