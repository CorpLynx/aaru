<!-- @dsCard group="Spacing" viewport="700x120" subtitle="120 / 200 / 320ms, ease-out; only the generating pulse loops" name="Motion" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg-app);color:var(--text-primary);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}.m{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}.d{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body><div style="padding:24px;display:flex;gap:32px;align-items:center"><div style="display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-secondary)"><span style="width:8px;height:8px;border-radius:999px;background:var(--aaru-ember);animation:aaruPulse 1.2s ease-in-out infinite"></span>Writing · generating pulse</div><div style="flex:1;position:relative;height:40px;border-radius:12px;background:var(--aaru-ink-800);border:1px solid var(--aaru-line-2);overflow:hidden"><div style="position:absolute;top:0;left:0;right:0;height:1px;overflow:hidden"><div style="width:33%;height:1px;background:var(--aaru-ember);animation:aaruScan 1.6s cubic-bezier(.2,.8,.2,1) infinite"></div></div><span class="d" style="position:absolute;left:12px;top:13px">composer scan line</span></div><div class="d" style="line-height:16px">--dur-fast 120ms<br>--dur-base 200ms<br>--dur-slow 320ms<br>--ease-out</div></div></body></html>
