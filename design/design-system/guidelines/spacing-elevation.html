<!-- @dsCard group="Spacing" viewport="700x140" subtitle="Borders + surface steps; shadows only on floating layers" name="Elevation" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg-app);color:var(--text-primary);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}.m{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}.d{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body><div style="padding:20px 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px"><div style="height:88px;border-radius:8px;background:var(--aaru-ink-900);box-shadow:none;padding:10px;display:flex;flex-direction:column;justify-content:flex-end"><span class="m">--elev-0</span><span class="d">flat</span></div><div style="height:88px;border-radius:8px;background:var(--aaru-ink-850);box-shadow:var(--elev-1);padding:10px;display:flex;flex-direction:column;justify-content:flex-end"><span class="m">--elev-1</span><span class="d">card</span></div><div style="height:88px;border-radius:8px;background:var(--aaru-ink-800);box-shadow:var(--elev-2);padding:10px;display:flex;flex-direction:column;justify-content:flex-end"><span class="m">--elev-2</span><span class="d">menu, popover</span></div><div style="height:88px;border-radius:8px;background:var(--aaru-ink-700);box-shadow:var(--elev-3);padding:10px;display:flex;flex-direction:column;justify-content:flex-end"><span class="m">--elev-3</span><span class="d">modal</span></div></div></body></html>
