<!-- @dsCard group="Components" viewport="700x280" name="Forms" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:var(--bg-app);color:var(--text-primary);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../ds-loader.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const L = ({ children }) => <div style={{ fontFamily: "var(--font-mono)", fontSize: 10, letterSpacing: "0.08em", color: "var(--text-muted)" }}>{children}</div>;
const Row = ({ children, gap = 8, style }) => <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap, ...style }}>{children}</div>;
loadAaruDS("../../").then(NS => {
  const App = () => { const { Input, Select, Checkbox, Switch, SegmentedControl } = NS;
  const [seg, setSeg] = React.useState("moe");
  return <div style={{ padding: 20, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
    <Input label="API endpoint" mono defaultValue="https://api.aaru.ai/v1" hint="OpenAI-compatible." />
    <Select label="Default model" options={[{ value: "q", label: "Qwen3 235B · Quick" }, { value: "l", label: "Llama 3.3 70B · Deep" }]} />
    <Input icon="search" placeholder="Search sealed chats" />
    <Input label="Key fingerprint" mono defaultValue="7F3A C219" error="Doesn't match this device." />
    <Row gap={20}><Checkbox label="Include in context" defaultChecked /><Switch label="Live metrics" defaultChecked /></Row>
    <Row><SegmentedControl value={seg} onChange={setSeg} options={[{ value: "moe", label: "Quick", icon: "zap" }, { value: "dense", label: "Deep", icon: "brain" }]} /><SegmentedControl size="sm" value="a" options={[{ value: "a", label: "All" }, { value: "b", label: "Docs" }, { value: "c", label: "Code" }]} /></Row>
  </div>; };
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
});
</script></body></html>
