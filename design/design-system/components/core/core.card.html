<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:var(--bg-app);color:var(--text-primary);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>

<script src="../../ds-loader.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const L = ({ children }) => <div style={{ fontFamily: "var(--font-mono)", fontSize: 10, letterSpacing: "0.08em", color: "var(--text-muted)" }}>{children}</div>;
const Row = ({ children, gap = 8, style }) => <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap, ...style }}>{children}</div>;
loadAaruDS("../../").then(NS => {
  const App = () => { const { Button, IconButton, Badge, Card, Kbd, Logo } = NS;
  return <div style={{ padding: 20, display: "flex", flexDirection: "column", gap: 14 }}>
    <L>LOGO</L>
    <Row gap={24}><Logo size={32} /><Logo size={20} /><Logo variant="mark" size={24} /><Logo variant="mark" size={16} /></Row>
    <L>BUTTON · md 36px</L>
    <Row><Button variant="primary" icon="plus">New chat</Button><Button>Secondary</Button><Button variant="ghost">Ghost</Button><Button variant="danger">Delete vault</Button><Button disabled>Disabled</Button></Row>
    <L>SIZES · IDE 28 / WEB 36 / MOBILE 44 · ICON BUTTONS</L>
    <Row><Button size="sm" variant="primary">Apply</Button><Button size="md">Copy</Button><Button size="lg" variant="primary">Continue</Button><IconButton icon="copy" label="Copy" /><IconButton icon="refresh-cw" label="Regenerate" active /><IconButton icon="git-branch" label="Branch" /><IconButton icon="menu" label="Menu" size="lg" /></Row>
    <L>BADGE · CARD · KBD</L>
    <Row><Badge tone="signal" mono icon="library">3 DOCS</Badge><Badge tone="caution" icon="triangle-alert">Context 84%</Badge><Badge tone="fault">Key mismatch</Badge><Badge>Draft</Badge><Kbd>⌘K</Kbd><Card padding={10} style={{ fontSize: 12, color: "var(--text-secondary)" }}>Card · ink-900 + line-1</Card><Card tone="well" padding={10} style={{ fontFamily: "var(--font-mono)", fontSize: 11 }}>well</Card></Row>
  </div>; };
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
});
</script></body></html>
