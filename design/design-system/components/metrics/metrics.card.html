<!-- @dsCard group="Components" viewport="700x260" name="Metrics" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:var(--bg-app);color:var(--text-primary);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../ds-loader.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const L = ({ children }) => <div style={{ fontFamily: "var(--font-mono)", fontSize: 10, letterSpacing: "0.08em", color: "var(--text-muted)" }}>{children}</div>;
const Row = ({ children, gap = 8, style }) => <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap, ...style }}>{children}</div>;
loadAaruDS("../../").then(NS => {
  const App = () => { const { GeneratingPulse, MetricChip, ContextBar, AmbientStatus } = NS;
  return <div style={{ padding: 20, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <L>L0 · AMBIENT STATUS</L>
      <AmbientStatus speed={48} engine="boost" />
      <AmbientStatus speed={11} engine="onboard" verb="Thinking" />
      <AmbientStatus generating={false} speed={32} engine="boost" />
      <L>L1 · METRIC CHIPS</L>
      <Row gap={4}><MetricChip kind="speed" value="48.2 tok/s" live /><MetricChip kind="speed" value="44.9 tok/s avg" /><MetricChip kind="engine" value="Boost" /><MetricChip kind="context" percent={31} /><MetricChip kind="context" percent={86} /></Row>
    </div>
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <L>CONTEXT BAR</L>
      <ContextBar system={7.7} documents={23} chat={9} total={128} />
      <ContextBar system={4} documents={18} chat={7} total={32} legend={false} label="CONTEXT · NEAR LIMIT" />
      <Row><GeneratingPulse /><GeneratingPulse size={8} /><span style={{ fontSize: 12, color: "var(--text-muted)" }}>Generating pulse</span></Row>
    </div>
  </div>; };
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
});
</script></body></html>
