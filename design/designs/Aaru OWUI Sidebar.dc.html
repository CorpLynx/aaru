<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:260px;height:100%;flex-shrink:0;background:#0A0C0F;border-right:1px solid #1E232A;display:flex;flex-direction:column;padding:12px 10px;gap:12px;font-family:'Geist',system-ui,sans-serif;color:#EDEFF2;font-size:13px">
  <div style="display:flex;align-items:center;gap:8px;padding:4px 6px">
    <svg width="20" height="20" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6.5"><rect x="47" y="10" width="13" height="46" rx="6.5"></rect><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(60 50 50)"></rect><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(120 50 50)"></rect><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(180 50 50)"></rect><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(240 50 50)"></rect><rect x="47" y="10" width="13" height="46" rx="6.5" transform="rotate(300 50 50)"></rect></svg>
    <span style="font-weight:600;font-size:18px;letter-spacing:-0.03em;flex:1">aaru</span>
    <i class="icon-panel-left" style="font-size:16px;color:#6E7682"></i>
  </div>
  <div style="display:flex;flex-direction:column;gap:2px">
    <div style="display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;border:1px solid #2A3039;background:#101318"><i class="icon-square-pen" style="font-size:15px"></i>New chat<span style="margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:#6E7682">⌘⇧O</span></div>
    <div style="display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;color:#A6ADB8"><i class="icon-search" style="font-size:15px"></i>Search</div>
    <div style="display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;color:{{ knowColor }};background:{{ knowBg }}"><i class="icon-library" style="font-size:15px"></i>Vault</div>
    <div style="display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;color:#A6ADB8"><i class="icon-layout-grid" style="font-size:15px"></i>Workspace</div>
  </div>
  <div style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:1px">
    <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;color:#6E7682;padding:8px 10px 4px">TODAY</div>
    <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:{{ chatBg }};color:{{ chatColor }}"><i class="icon-lock" style="font-size:10px;color:#3DDC97"></i>Supplier contract review</div>
    <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:#A6ADB8"><i class="icon-lock" style="font-size:10px;color:#3DDC97"></i>Q3 board memo draft</div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;color:#6E7682;padding:12px 10px 4px">PREVIOUS 7 DAYS</div>
    <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:#A6ADB8"><i class="icon-lock" style="font-size:10px;color:#3DDC97"></i>Rust borrow checker notes</div>
    <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:#A6ADB8"><i class="icon-lock" style="font-size:10px;color:#3DDC97"></i>Postgres index tuning</div>
    <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:#A6ADB8"><i class="icon-lock" style="font-size:10px;color:#3DDC97"></i>Explain tokio::select!</div>
  </div>
  <div style="padding:10px 12px;border-radius:8px;border:1px solid #1E232A;display:flex;flex-direction:column;gap:4px">
    <div style="display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.04em;color:#6E7682"><span>SERVER</span><span style="color:#3DDC97">● ONLINE</span></div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#A6ADB8">iGPU 41% · eGPU 62%</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;padding:4px 6px">
    <span style="width:28px;height:28px;border-radius:999px;background:#1F242C;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500">MK</span>
    <span style="flex:1">Mara K.</span>
    <span style="display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border:1px solid rgba(230,194,122,0.6);background:rgba(230,194,122,0.12);border-radius:4px;color:#E6C27A;font-size:11px;font-weight:500"><i class="icon-gem" style="font-size:10px"></i>Founders</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:800},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;chat&quot;,&quot;knowledge&quot;,&quot;none&quot;],&quot;default&quot;:&quot;chat&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'chat';
    return {
      chatBg: a === 'chat' ? '#1F242C' : 'transparent', chatColor: a === 'chat' ? '#EDEFF2' : '#A6ADB8',
      knowBg: a === 'knowledge' ? '#1F242C' : 'transparent', knowColor: a === 'knowledge' ? '#EDEFF2' : '#A6ADB8',
    };
  }
}
</script>
</body>
</html>
