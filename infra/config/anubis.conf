# Anubis (CorpLynx/Anubis): the security scan every new model must pass before
# it can be served. Only infra/scripts/fetch-model.sh uses it; it is not part of
# normal operation. infra/scripts/build-anubis-image.sh rewrites ANUBIS_IMAGE.
#
# Empty until the first image build. Until then, fetch-model.sh needs ANUBIS_BIN
# pointing at a locally installed `anubis` CLI.
ANUBIS_IMAGE=ghcr.io/corplynx/anubis@sha256:f339bc71ecf384010bca676ccbb0a3b944ea45ed16e07ee8e04aaa33611f25e6

# Fail on HIGH or CRITICAL findings, and on a scan that could not finish (an
# unread file is not a clean file). Budgets cover large multi-file models;
# Anubis reads headers, metadata and chat templates, not every weight.
ANUBIS_SCAN_ARGS="--fail-on high --require-complete --max-bytes 8GiB --max-seconds 900"
