<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>${title}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Aaru design tokens — flat colour only, no gradients or textures. */
      :root {
        --ink-950: #050607;
        --ink-900: #0a0c0f;
        --ink-800: #161a20;
        --line-1: #1e232a;
        --fg-1: #edeff2;
        --fg-2: #a6adb8;
        --fg-3: #6e7682;
        --signal: #6fa8ff;
        --fault: #ff5468;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--ink-950);
        color: var(--fg-1);
        font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
          Arial, sans-serif;
        font-size: 15px;
        line-height: 1.55;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      main {
        width: 100%;
        max-width: 420px;
      }

      .mark {
        display: block;
        height: 28px;
        width: auto;
        margin-bottom: 28px;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 10px;
      }

      p {
        color: var(--fg-2);
        margin: 0 0 8px;
      }

      p:last-of-type {
        margin-bottom: 0;
      }

      hr {
        border: 0;
        border-top: 1px solid var(--line-1);
        margin: 24px 0;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--fg-3);
        margin-bottom: 18px;
      }

      .status::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--fault);
      }

      a {
        color: var(--signal);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      code {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        color: var(--fg-2);
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="${logo_url}" alt="Aaru" />
      <div class="status">Access denied</div>
      <h1>${title}</h1>
      <p>${message}</p>
      <p>
        Aaru is invite-only. If you are expecting access, ask an operator to add
        your email address to the member list, then try again.
      </p>
      <hr />
      <p>
        Machine clients should authenticate with a service token instead:
        <code>CF-Access-Client-Id</code> and <code>CF-Access-Client-Secret</code>.
      </p>
    </main>
  </body>
</html>
